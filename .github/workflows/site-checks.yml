name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate distribution tooling
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Build production site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Validate metadata, sitemap, exclusions, and internal links
        run: python scripts/validate_site.py
      - name: Generate a representative distribution kit
        run: python scripts/distribution_kit.py tests/fixtures/2026-07-25-representative.md --output-dir "$RUNNER_TEMP/distribution"
